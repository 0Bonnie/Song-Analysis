<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>數學新聞</title>
    <link rel="icon" href="/static/rabbit.png" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    {% extends "navbar.html" %}
    {% block content %}
    <h1>數學新聞</h1>

    <form action="{{ url_for('crawl_math_news') }}" method="POST">
        <button type="submit">🐰 爬取最新數學新聞</button>
    </form>

    {% if articles %}
        <ul>
            {% for article in articles %}
                <li>
                    <a href="{{ article.link }}" target="_blank">
                        {{ article.title }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>沒有抓到資料。</p>
    {% endif %}
    {% endblock %}
</body>
</html>
