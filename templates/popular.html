<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Quanta Magazine Most Read</title>
    <link rel="icon" href="/static/rabbit.png" type="image/png">
</head>
<body>
    <h1>Most Read in Mathematics</h1>

    {% if articles %}
        <ul>
            {% for article in articles %}
                <li>
                    <a href="{{ article.link }}" target="_blank">
                        {{ article.title }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>沒有抓到資料。</p>
    {% endif %}
</body>
</html>
